<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PeerDrop Server Storage</title>
<style>
body{font-family:Arial,sans-serif;background:#0d0818;color:#eee;margin:0;padding:40px}
main{max-width:720px;margin:auto;background:#140d24;border:1px solid #3d2b63;border-radius:12px;padding:28px}
h1{margin-top:0}input,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #3d2b63}
input[type=url],input[type=password]{width:100%;box-sizing:border-box;background:#0d0818;color:#fff;margin:7px 0 14px}
button{background:#ff4fc3;color:#160817;font-weight:700;cursor:pointer}
#drop{border:2px dashed #ff4fc3;padding:30px;text-align:center;border-radius:10px;margin:20px 0}
#out{word-break:break-all;line-height:1.6}
small{color:#a995c9}
</style>
</head>
<body>
<main>
<h1>PeerDrop server storage</h1>
<small>Files are stored on the server, not in this browser.</small>
<label>server URL</label>
<input id="api" type="url" placeholder="https://your-server.example.com">
<label>storage token (only if your server uses one)</label>
<input id="token" type="password" placeholder="optional">
<div id="drop">choose a file<br><br><input id="file" type="file"></div>
<button id="upload">upload</button>
<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
$('api').value=localStorage.getItem('pd_api')||location.origin;
$('token').value=localStorage.getItem('pd_token')||'';
$('upload').onclick=async()=>{
  const api=$('api').value.replace(/\/$/,'');
  const token=$('token').value;
  const f=$('file').files[0];
  if(!f)return $('out').textContent='select a file first';
  localStorage.setItem('pd_api',api); localStorage.setItem('pd_token',token);
  $('out').textContent='uploading '+f.name+'...';
  const fd=new FormData(); fd.append('file',f,f.name);
  const r=await fetch(api+'/upload',{method:'POST',headers:token?{Authorization:'Bearer '+token}:{},body:fd});
  const data=await r.json().catch(()=>({error:'bad server response'}));
  if(!r.ok)return $('out').textContent='error: '+(data.error||r.status);
  $('out').innerHTML='uploaded: <b>'+data.name+'</b><br><a href="'+data.url+'" target="_blank">'+data.url+'</a>';
};
</script>
</body>
</html>
